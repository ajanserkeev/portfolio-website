services:
  web:
    build:
      context: .
      target: web
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SQLITE_PATH=/data/tower.sqlite
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - CRM_WEBHOOK_URL=${CRM_WEBHOOK_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://localhost,http://localhost}
    volumes:
      - api-data:/data
    restart: unless-stopped

volumes:
  api-data:
  caddy-data:
  caddy-config:
